<!DOCTYPE html>
<html>
<head>
  <title>Login</title>

  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #6114e8, #3b0ca7);
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      color: white;
    }

    .card {
      width: 350px;
      background: white;
      color: black;
      padding: 30px;
      border-radius: 15px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.3);
      text-align: center;
    }

    .card h1 {
      margin-bottom: 20px;
      font-size: 28px;
      color: #4c07d8;
    }

    .input-group {
      position: relative;
      width: 100%;
    }

    input, select {
      width: 100%;
      padding: 12px;
      margin: 10px 0;
      border-radius: 8px;
      border: 1px solid #ccc;
      font-size: 15px;
    }

    .toggle-icon {
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      cursor: pointer;
      font-size: 18px;
      color: #4c07d8;
      user-select: none;
    }

    button {
      width: 100%;
      background: #4c07d8;
      border: none;
      padding: 12px;
      border-radius: 8px;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      transition: 0.2s;
    }

    button:hover {
      background: #3605a3;
    }

    .forgot-link {
      margin-top: 12px;
      display: block;
      font-size: 14px;
      color: #4c07d8;
      text-decoration: none;
    }

    .forgot-link:hover {
      text-decoration: underline;
    }

    .flash-box {
      background: #ffe5e5;
      color: #b30000;
      padding: 10px;
      margin-top: 15px;
      border-radius: 6px;
      font-size: 14px;
    }
  </style>
</head>

<body>
  <!-- Particle container for random roaming particles -->
  <div id="tsparticles"></div>
  
  <div class="card">
    <h1>Login</h1>

    <form method="POST" action="/login">

      <!-- Username -->
      <input type="text" name="username" placeholder="Username" required>

      <!-- Password with toggle -->
      <div class="input-group">
        <input type="password" id="password" name="password" placeholder="Password" required>
        <span class="toggle-icon" onclick="togglePassword()">👁️</span>
      </div>

      <!-- Startup / investor dropdown -->
      <select name="user_type" required>
        <option value="" disabled selected>Select User Type</option>
        <option value="startup">Startup</option>
        <option value="investor">Investor</option>
      </select>

      <button type="submit">Login</button>
    </form>

    <a href="/forgot_password" class="forgot-link">Forgot Password?</a>

    {% with messages = get_flashed_messages() %}
      {% if messages %}
        <div class="flash-box">
            {% for message in messages %}
               {{ message }}<br>
            {% endfor %}
        </div>
      {% endif %}
    {% endwith %}
  </div>

  <script>
    function togglePassword() {
      const pass = document.getElementById("password");
      pass.type = pass.type === "password" ? "text" : "password";
    }
  </script>

  <!-- Initialize tsParticles -->
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      tsParticles.load("tsparticles", {
        particles: {
          number: { value: 100, density: { enable: true, area: 800 } },
          color: { value: "#ffffff" },
          shape: { type: "circle" },
          opacity: { value: 0.3, random: true },
          size: { value: 3, random: { enable: true, minimumValue: 1 } },
          move: {
            enable: true,
            speed: 3,
            direction: "none",
            random: true,
            straight: false,
            outModes: "bounce"
          }
        },
        interactivity: { events: { onhover: { enable: false }, onclick: { enable: false } } },
        retina_detect: true
      });
    });
  </script>
</body>
</html>
