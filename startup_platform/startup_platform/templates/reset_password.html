<!DOCTYPE html>
<html>
<head>
  <title>Reset Password</title>

  <style>
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #6114e8, #3b0ca7);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            color: white;
        }

        .card {
            width: 350px;
            background: white;
            color: black;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
            text-align: center;
        }

        .card h1 {
            margin-bottom: 20px;
            font-size: 26px;
            color: #4c07d8;
        }

        input {
            width: 100%;
            padding: 12px;
            margin: 15px 0;
            border-radius: 8px;
            border: 1px solid #ccc;
            font-size: 16px;
        }

        button {
            width: 100%;
            background: #4c07d8;
            border: none;
            padding: 12px;
            border-radius: 8px;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
            margin-top: 10px;
        }

        button:hover {
            background: #3605a3;
        }

        ul {
            color: red;
            text-align: left;
        }
  </style>
</head>
<body>

  <div class="card">
      <h1>Reset Password</h1>

      <form method="POST">
        <input type="password" name="password" placeholder="Enter new password" required>
        <button type="submit">Reset</button>
      </form>

      {% with messages = get_flashed_messages() %}
        {% if messages %}
          <ul>
            {% for m in messages %}
              <li>{{ m }}</li>
            {% endfor %}
          </ul>
        {% endif %}
      {% endwith %}
  </div>

</body>
</html>
