<!DOCTYPE html>
<html>
<head>
  <title>Edit Project</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
  <style>
    body { font-family: Arial, sans-serif; background: #f4f4f4; margin: 0; padding: 0; }
    .container { max-width: 500px; margin: 5% auto; background: #fff; padding: 2rem; border-radius: 8px; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
    h2 { text-align: center; }
    input, textarea { width: 100%; padding: 0.5rem; margin: 0.5rem 0; border-radius: 4px; border: 1px solid #ccc; }
    button { cursor: pointer; padding: 0.5rem 1rem; border: none; border-radius: 4px; background: #007bff; color: #fff; display: block; margin: 1rem auto; }
    a { text-decoration: none; color: #007bff; display: block; text-align: center; margin-top: 1rem; }
  </style>
</head>
<body>
  <div class="container">
    <h2>Edit Project</h2>
    <form action="{{ url_for('edit_project') }}" method="POST">
      <input type="hidden" name="old_name" value="{{ project.name }}">
      <label for="project_name">Project Name:</label>
      <input type="text" name="project_name" value="{{ project.name }}" required>
      
      <label for="project_desc">Project Description:</label>
      <textarea name="project_desc" required>{{ project.desc }}</textarea>
      
      <button type="submit">Update Project</button>
    </form>
    <a href="{{ url_for('startup_dashboard') }}">Cancel & Go Back</a>
  </div>
</body>
</html>
