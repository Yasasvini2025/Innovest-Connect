<!DOCTYPE html>
<html>
<head>
  <title>Reset Password – OTP Verification</title>
  <style>
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #6114e8, #3b0ca7);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            color: white;
        }

        .card {
            width: 350px;
            background: white;
            color: black;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
            text-align: center;
        }

        .card h1 {
            margin-bottom: 10px;
            font-size: 26px;
            color: #4c07d8;
        }

        .subtitle {
            color: #333;
            margin-bottom: 20px;
            font-size: 15px;
        }

        input {
            width: 100%;
            padding: 12px;
            margin: 15px 0;
            border-radius: 8px;
            border: 1px solid #ccc;
            font-size: 16px;
            text-align: center;
        }

        button {
            width: 100%;
            background: #4c07d8;
            border: none;
            padding: 12px;
            border-radius: 8px;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
            margin-top: 10px;
        }

        button:hover {
            background: #3605a3;
        }

        ul {
            color: red;
            text-align: left;
        }

        .expired {
            color: red;
            font-weight: bold;
            margin-top: 10px;
        }
    </style>
</head
